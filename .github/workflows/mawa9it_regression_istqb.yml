name: MAWA9IT - Regression Suite ISTQB 2025

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation et tests backend (Jest + TDD)
        run: |
          cd backend
          npm ci
          npm run test -- --coverage --watchAll=false

      - name: Installation frontend et tests E2E (Cypress)
        run: |
          cd frontend
          npm ci
          npx cypress run --browser chrome --headless

      - name: Upload des artefacts Cypress (si échec)
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-failures
          path: frontend/cypress/videos/