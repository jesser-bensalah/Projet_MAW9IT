name: MAWA9IT - Analyse Statique SonarCloud (Shift-Left) - Cas de Panne 

on:
  push:
    branches: [ dev ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ dev ]

jobs:
  sonarcloud-caspanne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Test uniquement CasPanne (Jest + Coverage)
        run: |
          cd backend
          npx jest "caspanne" --coverage --coverageDirectory=coverage-caspanne --coverageReporters=lcov

      - name: SonarCloud Scan - Cas de Panne
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=mawa9it-jesserbensalah-2025
            -Dsonar.organization=mawa9it-jesserbensalah-2025
            -Dsonar.projectName=MAWA9IT
            -Dsonar.sources=backend/src/caspanne
            -Dsonar.tests=backend/src/caspanne
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.typescript.lcov.reportPaths=backend/coverage-caspanne/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            # Fallback pour branches : SonarCloud détectera auto 'dev' comme default