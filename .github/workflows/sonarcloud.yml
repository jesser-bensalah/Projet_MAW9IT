name: MAWA9IT - Analyse Statique SonarCloud (Shift-Left) - Cas de Panne Seulement

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  sonarcloud-caspanne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

    
      - name: Test uniquement CasPanne (Jest)
        run: |
          cd backend
          npx jest "caspanne" --coverage --coverageDirectory=coverage-caspanne

      
      - name: SonarCloud Scan - Cas de Panne 
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MAWA9IT-caspanne-votre-nom-2025
            -Dsonar.organization=votre-org-sonarqube
            -Dsonar.sources=backend/src/caspanne
            -Dsonar.tests=backend/src/caspanne
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=backend/coverage-caspanne/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.projectName="MAWA9IT - Cas de Panne (Shift-Left)"